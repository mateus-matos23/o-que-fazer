[project]
name = "o-que-fazer"
version = "0.1.0"
description = "Orientação ao cidadão para acesso a serviços públicos a partir de situações cotidianas."
readme = "README.md"
authors = [
    { name = "Mateus Oliveira", email = "mateus.m.oliveira2303@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "django>=6.1.2",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py315"
extend-exclude = [".agents", ".claude", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM", "RUF"]
# Meta e migrations do Django usam listas como atributo de classe por convenção.
ignore = ["RUF012"]

[tool.mypy]
strict = true
plugins = ["mypy_django_plugin.main"]
exclude = ["^docs/", "^\\.agents/"]

[[tool.mypy.overrides]]
module = ["*.migrations.*"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
