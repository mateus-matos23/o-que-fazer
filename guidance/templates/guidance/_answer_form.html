<form method="post" class="answer-form">
  {% csrf_token %}
  <input type="hidden" name="question" value="{{ question.slug }}">
  {% if form.errors %}
  <div id="form-errors" class="errors" tabindex="-1" autofocus>
    <p><strong>Erro:</strong> corrija a resposta antes de continuar.</p>
    {{ form.non_field_errors }}
    {{ form.answer.errors }}
  </div>
  {% endif %}
  <fieldset{% if question.help_text or form.errors %} aria-describedby="{% if question.help_text %}question-help{% endif %}{% if question.help_text and form.errors %} {% endif %}{% if form.errors %}form-errors{% endif %}"{% endif %}>
    <legend><h1>{{ form.answer.label }}</h1></legend>
    {% if question.help_text %}
    <p id="question-help" class="question-help">{{ question.help_text }}</p>
    {% endif %}
    <div class="choices{% if question.kind == 'SINGLE' and question.allows_unknown %} has-unknown{% endif %}">
      {{ form.answer }}
    </div>
    {% if form.unknown %}
    <label class="choice unknown">{{ form.unknown }} {{ form.unknown.label }}</label>
    {% endif %}
  </fieldset>
  <button type="submit">Continuar</button>
</form>
