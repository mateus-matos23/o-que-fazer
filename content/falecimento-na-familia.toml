# Jornada "falecimento na família" (27/10/2026). Fonte da verdade: docs/dados/evidencias/falecimento-na-familia.md.
# Fontes: páginas gov.br do INSS (pensão por morte urbana e rural; certidão de inexistência de dependentes),
# coletadas em 27/10/2026. As três declaram "Última Modificação: 19/08/2026" (RN12).
#
# Decisões:
# - Duas perguntas: a relação com a pessoa que faleceu (SINGLE, sem "não sei") e o meio em que ela
#   trabalhava (SINGLE, com "não sei"). A relação decide se há dependente nas classes do INSS; "outra"
#   afasta as duas pensões sem perguntar o meio.
# - Pensão urbana e rural: regras separadas pelo meio. "Não sei" no meio deixa as duas indeterminadas,
#   nunca descartadas (RN03).
# - Certidão de inexistência de dependentes: sem regra; vale para quem precisa comprovar que a pessoa
#   falecida não tem dependentes recebendo pensão.
# - Custo: as três páginas declaram o serviço gratuito (COST). Prazo: só "Quanto tempo leva?" vira
#   DEADLINE; a pensão urbana e a certidão dizem "Não estimado ainda" e ficam "não informado".
# - Sem dependências: nenhum trecho ordena os três serviços (RN08).
#
# Fora da jornada (sem trecho literal ou sem fonte; não entram):
# - Certidão de óbito: cartório, sem fonte coletada.
# - Saque de FGTS/PIS por falecimento: a página do FGTS não tem texto no HTML e o slug gov.br retornou 404.
# - Pensão de servidor público (pensão civil): não coletada.
# - Acordo internacional: não coletado.

