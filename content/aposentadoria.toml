# Jornada "aposentadoria" (27/10/2026). Fonte da verdade: docs/dados/evidencias/aposentadoria.md.
# Fontes: páginas gov.br do INSS (aposentadoria por idade urbana e por tempo de contribuição, extrato
# do CNIS e simulador), coletadas em 27/10/2026. Declaram "Última Modificação" de 12/08/2026 a 20/08/2026 (RN12).
#
# Decisões:
# - Duas perguntas: o tipo de aposentadoria (SINGLE, com "não sei") e o meio de trabalho (SINGLE, sem
#   "não sei"). O meio só é perguntado quando a aposentadoria por idade pode valer.
# - Aposentadoria por idade: exige idade e meio urbano; a regra usa as duas perguntas. Meio rural fica fora
#   da cobertura: não há página oficial coletada para aposentadoria rural.
# - Aposentadoria por tempo de contribuição: a regra depende só do tipo, porque a página não restringe o
#   pedido ao meio urbano.
# - "Não sei" no tipo mantém as duas aposentadorias indeterminadas (RN03) e traz o simulador como
#   esclarecimento (não é candidato). O simulador não afirma direito: a página diz que o resultado "não
#   garante direito à aposentadoria".
# - Extrato do CNIS: sem regra (vale para qualquer pessoa com cadastro no CNIS).
# - Sem dependências entre os procedimentos (RN08).
# - Prazos: só "Quanto tempo leva?" (tempo estimado para a prestação do serviço) vira DEADLINE.
#   "Tempo estimado de espera" e "Tempo de duração da etapa" são tempos de atendimento ou de etapa.
# - Custo: as quatro páginas declaram o serviço gratuito (COST).
#
# Fora da jornada (sem trecho literal ou sem fonte; não entram):
# - Aposentadoria rural: a página gov.br não foi encontrada (slug retornou 404).
# - Aposentadoria por acordo internacional: não coletada.
# - Certidão de tempo de contribuição: não coletada.
# - Aposentadoria de servidor público: não coletada.

