# Jornada "perda de documentos". Fonte da verdade: docs/dados/evidencias/perda-de-documentos.md.
# Fonte principal: a página HTML (declara data); a API 10424 entra só para a URL dos canais web.
# Nas amostras HTML vale só o bloco de texto, que é truncado.
#
# Decisões:
# - Pergunta "documentos-perdidos" é MULTIPLE sem "não sei": o cidadão marca o que perdeu; vazio = nenhum.
# - CIN, CNH e título de eleitor são opções out_of_coverage: a evidência não tem fonte oficial lida
#   (CIN: a notícia da SSP-MA trata da primeira emissão e não há amostra; CNH: DETRAN-MA 404; título:
#   TSE/TRE-MA 403). O plano mostra o aviso de limite de cobertura.
# - O registro na Delegacia Online é candidato SEM regra: a página trata de "extravio de documentos"
#   em geral, então vale para qualquer escolha.
#
# Fora por falta de trecho literal nas amostras (a afirmação não entra; custo/prazo vira "não informado"):
# - Delegacia Online: custo e prazo não constam da página. Domínio delegaciaonline.ssp.ma.gov.br: não
#   confirmado (DNS), não entra.
# - Dependência B.O. -> segunda via: nenhum trecho a sustenta; o B.O. como pré-requisito é pendência
#   da evidência (observação 5). Nenhuma dependência criada.
# - Esclarecimento intermediário: "não sabe o número do CPF" só tem a orientação genérica de contatar
#   a Receita, sem canal lido; não foi criado.
# - Conta gov.br nível prata/ouro para o canal gov.br: o trecho está fora do bloco de texto da amostra.
# - Condição do canal "sem gov.br" (não ter declarado IR nos últimos dois anos): está no texto da página
#   (amostra), o que resolve a observação 6 da evidência; entra na descrição do canal.
# - Segunda via de CIN, CNH e título de eleitor: sem procedimento (sem fonte oficial lida). Valores de
#   terceiros (R$ 45,00, R$ 61,30, R$ 44,19) e portarias do TSE não entram.
# - Prazo do CPF: só o atendimento por e-mail tem número ("em média, 48 horas"); a API não traz prazo.

