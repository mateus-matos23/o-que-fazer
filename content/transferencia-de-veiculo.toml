# Jornada "transferência de veículo". Fonte da verdade: docs/dados/evidencias/transferencia-de-veiculo.md.
# Fonte principal: página da transferência digital do DETRAN-MA (id 23692), sem data declarada (RN12:
# "não informado"). A página do balcão (id 19272) segue em defeso eleitoral em 27/10/2026; o balcão
# é citado pela própria página digital, que lista os casos que vão para o atendimento presencial.
#
# Decisões:
# - Duas perguntas: como o veículo muda de dono (SINGLE) e se ele está num dos casos de balcão
#   (MULTIPLE, vazio = nenhum). A transferência digital exige compra e venda E nenhum caso de balcão;
#   o balcão vale para herança, doação ou leilão OU para qualquer caso marcado (OU de regras).
# - "Não sei" só nos casos de balcão: quem não sabe se o CRV é digital fica com as duas transferências
#   indeterminadas, nunca com uma delas descartada (RN03).
# - Vistoria em ECV antes da transferência digital: dependência MANDATORY ("Após aprovação, o usuário
#   seguirá para a plataforma online"). A vistoria só aparece com a transferência digital: a página
#   não a descreve para o balcão.
# - Consulta de restrições (Senatran) antes da transferência: RECOMMENDED. A página do DETRAN-MA pede
#   que "não conste restrições", mas não exige a consulta; a ordem é sugestão (RN08).
#
# Fora por falta de trecho literal ou de fonte (a afirmação não entra; custo/prazo vira "não informado"):
# - Taxa da transferência: a tabela de taxas lida não traz o item. Prazo: não consta.
# - Documentos de cada caso de balcão: a página diz "documentação específica para cada caso" e remete à
#   Portaria Detran 166/2020, que não foi lida.
# - Vistoria reprovada por mudança de característica ou regravação de chassi/motor leva ao balcão: o
#   resultado da vistoria não é perguntado (só se sabe depois dela); fica na descrição da vistoria.
# - Débitos (IPVA, multas) como impedimento: hipótese sem trecho nas amostras.

