# Jornada "CPF irregular". Fonte da verdade: docs/dados/evidencias/cpf-irregular.md.
# Rótulos divergentes entre fontes (RN13): gov.br usa "Suspensa"; a Receita usa "Suspenso".
# Aqui a opção segue o rótulo da Receita (meu-cpf), que é a fonte dos trechos das regras.
# Fora desta jornada, por não estar confirmado em fonte oficial: título de eleitor (obs. 5 da evidência).
# Custo e prazo não documentados são omitidos (a interface mostra "não informado").

[[situations]]
slug = "cpf-irregular"
title = "Meu CPF está irregular"
candidates = [
  "regularizar-cpf-suspenso",
  "entregar-dirpf-pendente",
  "atendimento-receita-cpf",
]

[[questions]]
slug = "cpf-situacao-cadastral"
text = "Qual é a situação do seu CPF na consulta da Receita Federal?"
help = "Escolha o nome que aparece na consulta oficial do CPF. Se você ainda não consultou, escolha \"Não sei\": o plano mostra como consultar."
kind = "SINGLE"
allows_unknown = true
situations = ["cpf-irregular"]
options = [
  {slug = "suspenso", label = "Suspenso"},
  {slug = "pendente-de-regularizacao", label = "Pendente de Regularização"},
  {slug = "cancelado", label = "Cancelado"},
  {slug = "nulo", label = "Nulo"},
  {slug = "falecido", label = "Falecido"},
]

# Esclarecimento intermediário: não é candidato; entra no plano quando a situação é "não sei"
