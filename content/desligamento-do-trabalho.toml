# Jornada "desligamento do trabalho". Fonte da verdade: docs/dados/evidencias/desligamento-do-trabalho.md.
# Fonte principal de cada procedimento: a página HTML (declara data de atualização); a API entra só
# onde tem o campo (prazo estimado). Nas amostras HTML vale só o bloco de texto, que é truncado.
#
# Decisões:
# - A forma de término restringe os seguros e o saque do FGTS a "sem justa causa" (as fontes só citam
#   essa hipótese). Pedido de demissão e justa causa ficam NOT_APPLICABLE: é intencional e aprovado.
# - "Acordo", "culpa recíproca" e "fim de contrato" são opções fora de cobertura (out_of_coverage):
#   nenhuma fonte consultada trata delas; o plano mostra o aviso de limite.
# - O tipo de vínculo existe porque separa o seguro-desemprego 1045 do doméstico 9815 (RN02).
# - CTPS e CAGED são candidatos sem regra (aplicáveis a qualquer forma de término, conforme a evidência).
#
# Fora por falta de trecho literal nas amostras (a afirmação não entra; custo/prazo vira "não informado"):
# - Esclarecimento intermediário: nenhum trecho orienta a descobrir a forma de término nem o tipo de
#   vínculo; não foi criado.
# - Dependências: nenhum trecho estabelece precedência entre os procedimentos; nenhuma foi criada.
# - Custo do seguro-desemprego, do doméstico, do CAGED e do FGTS: "gratuito" só existe como campo
#   booleano da API (gratuito: "true"); o texto "Este serviço é gratuito" está fora das amostras.
#   O custo da CTPS (página "obter a carteira") tem trecho e entra.
# - Conta gov.br obrigatória (seguro, doméstico, CAGED, CTPS): o trecho "Utilize a sua conta GOV.BR"
#   está fora da amostra HTML.
# - Prazo do doméstico "7 a 90 dias": entra (HTML). O número de terceiros (7 a 120) não é usado.
# - Prazo para requerer o seguro 1045 e número máximo de solicitações: não informados na fonte.
# - Prazo estimado do CAGED: só a API tem ("30 dias-corridos", média); a página tem o texto fora da amostra.
#   Prazo estimado do seguro 1045 (31 a 60 dias corridos): fora. A API só o guarda como campos min/max
#   separados, sem texto corrido; o jsonb reordena as chaves, então não há trecho literal estável.
# - FGTS: documentos da agência, lotérica, telefones e o passo a passo do app estão fora da amostra
#   (truncada). Regras do saque-aniversário além da multa rescisória não entram (a evidência não as
#   confirma; blog e MP 1.290/2025 não são fonte oficial lida).
# - Consulta de vínculos na CTPS Digital: não há página própria (404). O vínculo entre CTPS e vínculos
#   só tem trecho na página do CAGED ("por meio da CTPS Digital"); o FAQ da CTPS não está nas amostras.
# - Atendimento presencial SINE/SRTE em São Luís e Maranhão: endereços, telefones e horários não
#   confirmados em fonte oficial; nenhum canal local foi criado.
# - Divergência de documentos do doméstico (página atual x eSocial 2020): prevalece a página atual (RN13).
# - Parcelas e valor do seguro 1045: trecho fora da amostra; do doméstico só a descrição genérica.

